<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Chart?</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <h2 style="text-align: center;">Godhand Chart Ratings</h2>

    <div>
      <label for="name-select">Name:</label>
      <select id="name-select"></select>

      <label for="display-mode">Display Mode:</label>
      <select id="display-mode">
        <option value="Combined">Combined</option>
        <option value="Split">Split</option>
      </select>
    </div>

    <!-- Combined chart -->
    <div id="combined-chart">
      <canvas id="chart1"></canvas>
    </div>

    <!-- Split charts -->
    <div id="split-charts">
      <div>
        <canvas id="chart-kindled"></canvas>
      </div>
      <div>
        <canvas id="chart-ascended"></canvas>
      </div>
      <div>
        <canvas id="chart-maximum"></canvas>
      </div>
      <div>
        <canvas id="chart-immortal"></canvas>
      </div>
    </div>

    <script>
      const difficultyNames = {
        0: "Kindled",
        1: "Ascended",
        2: "Maximum",
        3: "Immortal"
      };

      const difficultyColors = {
        0: "#36A2EB",
        1: "#FF6384",
        2: "#FFCE56",
        3: "#4BC0C0"
      };

      Chart.defaults.color = "#cccccc";

      let data;
      let chart;
      let splitChartInstances = [];

      const nameSelect = document.getElementById("name-select");
      const displayMode = document.getElementById("display-mode");
      const combinedChart = document.getElementById("combined-chart");
      const splitCharts = document.getElementById("split-charts");
      const ctx = document.getElementById("chart1");

      const splitCanvases = [
        document.getElementById("chart-kindled"),
        document.getElementById("chart-ascended"),
        document.getElementById("chart-maximum"),
        document.getElementById("chart-immortal")
      ];

      splitCharts.style.display = "none";

      fetch("data/diff-history.json")
        .then(response => response.json())
        .then(json => {
          data = json;
          populateNames();
          nameSelect.value = Object.keys(data)[0];
          createChart();
        })
        .catch(error => {
          console.error("Failed to load data:", error);
        });

      function populateNames() {
        nameSelect.innerHTML = "";

        for (const name of Object.keys(data)) {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          nameSelect.appendChild(option);
        }
      }

      function createChart() {
        if (displayMode.value === "Combined") {
          createCombinedChart();
        } else {
          createSplitCharts();
        }
      }

      function createCombinedChart() {
        combinedChart.style.display = "block";
        splitCharts.style.display = "none";

        if (chart) {
          chart.destroy();
          chart = null;
        }

        for (const splitChart of splitChartInstances) {
          splitChart.destroy();
        }
        splitChartInstances = [];

        const name = nameSelect.value;
        const difficulties = data[name];
        const datasets = [];

        let maxRating = 0;
        let latestTime = 0;

        for (const diff of Object.keys(difficulties)) {
          const history = difficulties[diff];
          const points = history.map(point => ({
            x: point.time,
            y: point.rating
          }));

          for (const point of points) {
            maxRating = Math.max(maxRating, point.y);

            const time = new Date(point.x).getTime();
            latestTime = Math.max(latestTime, time);
          }
        }

        const oneDay = 24 * 60 * 60 * 1000;
        const earliestTime = latestTime - oneDay;

        for (const diff of Object.keys(difficulties)) {
          const history = difficulties[diff];
          while (history.length > 1 && new Date(history[1].time).getTime() < earliestTime) history.shift()

          const points = history.map(point => ({
            x: point.time,
            y: point.rating
          }));

          if (points.length > 0) {
            points.push({
              x: Date.now(),
              y: points[points.length - 1].y
            });
          }

          datasets.push({
            label: difficultyNames[diff] ?? diff,
            data: points,
            borderWidth: 2,
            stepped: true,
            borderColor: difficultyColors[diff],
            pointRadius: context => {
              return context.dataIndex === points.length - 1 ? 0 : 3;
            },
            pointHoverRadius: context => {
              return context.dataIndex === points.length - 1 ? 0 : 3;
            }
          });
        }

        chart = new Chart(ctx, {
          type: "line",
          data: {
            datasets: datasets
          },
          options: {
            scales: {
              x: {
                type: "time",
                min: earliestTime,
                max: latestTime,
                time: {
                  tooltipFormat: "MMM d, yyyy h:mm a"
                }
              },
              y: {
                beginAtZero: true,
                max: Math.max(16000, maxRating)
              }
            }
          }
        });
      }

      function createSplitCharts() {
        combinedChart.style.display = "none";
        splitCharts.style.display = "grid";

        if (chart) {
          chart.destroy();
          chart = null;
        }

        for (const splitChart of splitChartInstances) {
          splitChart.destroy();
        }
        splitChartInstances = [];

        const name = nameSelect.value;
        const difficulties = data[name];

        let latestTime = 0;

        for (const diff of Object.keys(difficulties)) {
          for (const point of difficulties[diff]) {
            const time = new Date(point.time).getTime();
            latestTime = Math.max(latestTime, time);
          }
        }

        // Extend the x-axis to the current time.
        latestTime = Date.now();

        const oneDay = 24 * 60 * 60 * 1000;
        const earliestTime = latestTime - oneDay;

        for (let diff = 0; diff < 4; diff++) {
          if (!difficulties[diff]) {
            continue;
          }

          const history = difficulties[diff];
          while (history.length > 1 && new Date(history[1].time).getTime() < earliestTime) history.shift()

          const points = history.map(point => ({
            x: point.time,
            y: point.rating
          }));

          if (points.length > 0) {
            points.push({
              x: Date.now(),
              y: points[points.length - 1].y
            });
          }

          let maxRating = 0;
          let minRating = Infinity;

          for (const point of points) {
            maxRating = Math.max(maxRating, point.y);
            minRating = Math.min(minRating, point.y);
          }

          const midRating = (maxRating + minRating) / 2;

          const newChart = new Chart(splitCanvases[diff], {
            type: "line",
            data: {
              datasets: [{
                label: difficultyNames[diff] ?? diff,
                data: points,
                borderWidth: 2,
                stepped: true,
                borderColor: difficultyColors[diff],
                pointRadius: context => {
                  return context.dataIndex === points.length - 1 ? 0 : 3;
                },
                pointHoverRadius: context => {
                  return context.dataIndex === points.length - 1 ? 0 : 3;
                }
              }]
            },
            options: {
              scales: {
                x: {
                  type: "time",
                  min: earliestTime,
                  max: latestTime,
                  time: {
                    tooltipFormat: "MMM d, yyyy h:mm a"
                  }
                },
                y: {
                  suggestedMin: midRating - 25,
                  suggestedMax: midRating + 25
                }
              }
            }
          });

          splitChartInstances.push(newChart);
        }
      }

      nameSelect.addEventListener("change", () => {
        createChart();
      });

      displayMode.addEventListener("change", () => {
        createChart();
      });
    </script>
  </body>
</html>
