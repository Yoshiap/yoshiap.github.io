<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Chart?</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon"></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div>
        <label for="name-select">Name:</label>
        <select id="name-select"></select>
  
        <label for="diff-select">Difficulty:</label>
        <select id="diff-select"></select>
    </div>
    <div>
        <canvas id="chart1"></canvas>
    </div>
    <script>
        let chart;
        let data;
  
        const nameSelect = document.getElementById("name-select");
        const diffSelect = document.getElementById("diff-select");
        const ctx = document.getElementById("chart1");
  
        fetch("data/diff-history.json")
          .then(response => response.json())
          .then(json => {
            data = json;
  
            populateNames();
            nameSelect.value = Object.keys(data)[0];
  
            populateDifficulties();
            diffSelect.value = Object.keys(data[nameSelect.value])[0];
  
            updateChart();
          });
  
        function populateNames() {
          nameSelect.innerHTML = "";
  
          for (const name of Object.keys(data)) {
            const option = document.createElement("option");
            option.value = name;
            option.textContent = name;
            nameSelect.appendChild(option);
          }
        }
  
        function populateDifficulties() {
                diffSelect.innerHTML = "";
        
                const name = nameSelect.value;
        
                for (const diff of Object.keys(data[name])) {
                    const option = document.createElement("option");
                    option.value = diff;
                    option.textContent = diff;
                    diffSelect.appendChild(option);
                }
                }
        
                nameSelect.addEventListener("change", () => {
                populateDifficulties();
                updateChart();
                });
        
                diffSelect.addEventListener("change", () => {
                updateChart();
                });
        
                // Create/update the chart
                function updateChart() {
            const name = nameSelect.value;
            const difficulties = data[name];

            const datasets = [];
            let maxRating = 0;

            for (const diff of Object.keys(difficulties)) {
                const history = difficulties[diff];

                const points = history.map(point => ({
                    x: new Date(point.time),
                    y: point.rating
                }));

                for (const point of points) {
                    maxRating = Math.max(maxRating, point.y);
                }

                datasets.push({
                    label: diff,
                    data: points,
                    borderWidth: 2,
                    tension: 0.2
                });
            }

            chart.data.datasets = datasets;
            chart.options.scales.y.max = Math.max(16000, maxRating);
            chart.update();
        }
      </script>
  </body>
</html>
